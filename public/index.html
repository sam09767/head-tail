<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Coin Flip Casino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .coin-arena { perspective: 1000px; }
        .coin {
            width: 160px;
            height: 160px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }
        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 800;
            border: 4px solid #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        }
        .heads { background: linear-gradient(135deg, #fbbf24, #d97706); color: #1e293b; }
        .tails { background: linear-gradient(135deg, #f59e0b, #b45309); color: #ffffff; transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer select-none" id="brandLogo">
            <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">C</div>
            <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-amber-400 to-yellow-200 bg-clip-text text-transparent">COIN3D</span>
        </div>
        
        <div id="userState" class="hidden flex items-center space-x-4">
            <div class="bg-slate-800 border border-slate-700 px-4 py-1.5 rounded-full flex items-center space-x-2">
                <span class="text-xs text-slate-400">Balance:</span>
                <span id="walletBalance" class="text-amber-400 font-bold">₹0</span>
            </div>
            <button onclick="openModal('depositModal')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Deposit</button>
            <button onclick="openModal('withdrawModal')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm font-semibold transition">Withdraw</button>
        </div>

        <button id="authBtn" onclick="openModal('authModal')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-2 rounded-lg transition">Login / Register</button>
    </header>

    <!-- Main Game Canvas -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between space-y-6">
        
        <!-- Game Header & Timer -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-4 shadow-xl">
            <div class="flex justify-between items-center text-sm text-slate-400">
                <span>Next Spin In</span>
                <span id="history" class="flex space-x-1"></span>
            </div>
            <div id="timerDisplay" class="text-5xl font-black text-amber-400">00:30</div>
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div id="timerBar" class="bg-amber-400 h-full w-full transition-all duration-1000"></div>
            </div>
        </div>

        <!-- 3D Coin Arena -->
        <div class="coin-arena flex justify-center items-center py-8">
            <div id="coin" class="coin">
                <div class="coin-face heads">HEADS</div>
                <div class="coin-face tails">TAILS</div>
            </div>
        </div>

        <!-- Live Round Totals -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-center">
                <p class="text-xs text-slate-400">HEADS BETS</p>
                <p id="headsTotal" class="text-xl font-bold text-amber-400">₹0</p>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-center">
                <p class="text-xs text-slate-400">TAILS BETS</p>
                <p id="tailsTotal" class="text-xl font-bold text-amber-500">₹0</p>
            </div>
        </div>

        <!-- Bet Controls -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-xl">
            <div class="flex justify-between space-x-2">
                <button onclick="setChip(100)" class="chip-btn flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg font-bold border border-slate-700">₹100</button>
                <button onclick="setChip(500)" class="chip-btn flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg font-bold border border-slate-700">₹500</button>
                <button onclick="setChip(1000)" class="chip-btn flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg font-bold border border-slate-700">₹1000</button>
                <button onclick="setChip(5000)" class="chip-btn flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg font-bold border border-slate-700">₹5000</button>
            </div>
            <input type="number" id="betAmount" value="100" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-center font-bold text-amber-400 focus:outline-none focus:border-amber-500">
            
            <div class="grid grid-cols-2 gap-4 pt-2">
                <button onclick="placeBet('HEADS')" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-4 rounded-xl shadow-lg transition transform active:scale-95">BET HEADS</button>
                <button onclick="placeBet('TAILS')" class="bg-gradient-to-r from-yellow-600 to-amber-700 hover:from-yellow-500 hover:to-amber-600 text-slate-100 font-black py-4 rounded-xl shadow-lg transition transform active:scale-95">BET TAILS</button>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 max-w-sm w-full p-6 rounded-2xl space-y-4">
            <h2 class="text-xl font-bold text-center">Account Access</h2>
            <input id="loginUsername" type="text" placeholder="Username" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <input id="loginPassword" type="password" placeholder="Password" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="handleDirectAuth(false)" class="bg-amber-500 text-slate-950 font-bold py-2 rounded-lg">Login</button>
                <button onclick="handleDirectAuth(true)" class="bg-slate-800 hover:bg-slate-700 font-bold py-2 rounded-lg">Sign Up</button>
            </div>
            <p id="authMsg" class="text-xs text-center text-red-400"></p>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="depositModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 max-w-sm w-full p-6 rounded-2xl space-y-4 text-center">
            <h2 class="text-xl font-bold">Deposit Funds</h2>
            <div id="qrcode" class="flex justify-center p-2 bg-white rounded-lg w-48 h-48 mx-auto"></div>
            <p id="upiIdDisplay" class="text-xs text-amber-400 font-mono"></p>
            <input id="depAmount" type="number" placeholder="Amount (₹)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <input id="depTxn" type="text" placeholder="UTR / Transaction ID" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <button onclick="submitDeposit()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-bold">Submit Deposit</button>
            <button onclick="closeModal('depositModal')" class="text-xs text-slate-500">Cancel</button>
        </div>
    </div>

    <!-- Withdrawal Modal -->
    <div id="withdrawModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 max-w-sm w-full p-6 rounded-2xl space-y-4 text-center">
            <h2 class="text-xl font-bold">Withdraw Funds</h2>
            <input id="wdAmount" type="number" placeholder="Amount (₹)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <input id="wdUpi" type="text" placeholder="Your UPI ID" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <button onclick="submitWithdrawal()" class="w-full bg-amber-500 text-slate-950 py-3 rounded-lg font-bold">Request Cashout</button>
            <button onclick="closeModal('withdrawModal')" class="text-xs text-slate-500">Cancel</button>
        </div>
    </div>

    <!-- Hidden Admin Panel Modal -->
    <div id="adminModal" class="hidden fixed inset-0 bg-black/90 z-50 p-4 overflow-y-auto">
        <div id="adminAuthSection" class="max-w-sm mx-auto my-20 bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
            <h2 class="text-xl font-bold text-center text-red-500">Admin Authentication</h2>
            <input id="adminPass" type="password" placeholder="Admin Secret Password" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <button onclick="authenticateAdmin()" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold">Access Panel</button>
        </div>

        <div id="adminDashboard" class="hidden max-w-4xl mx-auto space-y-6">
            <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
                <h1 class="text-2xl font-bold text-amber-400">House Control Center</h1>
                <button onclick="closeModal('adminModal')" class="bg-slate-800 px-4 py-2 rounded-lg">Close</button>
            </div>

            <!-- Stats & Smart Edge Controls -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-400">Net House Profit</p>
                    <p id="admProfit" class="text-2xl font-bold text-emerald-400">₹0</p>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-400">Total Volume</p>
                    <p id="admVolume" class="text-2xl font-bold text-amber-400">₹0</p>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-400">Smart Engine Mode</p>
                    <select id="admOutcomeSelect" onchange="changeOutcomeMode(this.value)" class="w-full bg-slate-950 border border-slate-800 mt-1 p-2 rounded text-amber-400 font-bold">
                        <option value="AUTO">SMART AUTO (House Advantage)</option>
                        <option value="FORCE_HEADS">FORCE HEADS</option>
                        <option value="FORCE_TAILS">FORCE TAILS</option>
                    </select>
                </div>
            </div>

            <!-- Global Settings -->
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex items-center space-x-4">
                <input id="admUpiInput" type="text" placeholder="Active Receiver UPI" class="flex-1 bg-slate-950 border border-slate-800 p-2 rounded text-white">
                <button onclick="saveAdminUpi()" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-lg font-bold">Update Receiver UPI</button>
            </div>

            <!-- Users & Pending Requests -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                    <h3 class="font-bold border-b border-slate-800 pb-2">Pending Deposits</h3>
                    <div id="admDepositsList" class="space-y-2 max-h-60 overflow-y-auto text-sm"></div>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                    <h3 class="font-bold border-b border-slate-800 pb-2">Pending Withdrawals</h3>
                    <div id="admWithdrawalsList" class="space-y-2 max-h-60 overflow-y-auto text-sm"></div>
                </div>
            </div>

            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                <h3 class="font-bold border-b border-slate-800 pb-2">User Directory & Wallets</h3>
                <div id="admUsersList" class="space-y-2 max-h-60 overflow-y-auto text-sm"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
