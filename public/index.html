<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Coin Flip Casino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }
        
        .coin-scene {
            perspective: 1000px;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            position: relative;
        }
        
        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease-out;
            cursor: pointer;
        }
        
        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 50%, #fbbf24 100%);
            border: 4px solid #f59e0b;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
        }
        
        .coin-heads {
            transform: rotateY(0deg);
        }
        
        .coin-tails {
            transform: rotateY(180deg);
        }
        
        .coin-edge {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(90deg, #b45309 0%, #d97706 50%, #b45309 100%);
            transform: translateZ(5px);
        }
        
        .glow-effect {
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.5), 0 0 80px rgba(251, 191, 36, 0.2);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #0f172a;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
        }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .input-field {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            width: 100%;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }
        
        .timer-bar {
            transition: width 1s linear;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body class="text-slate-200">
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-lg border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div id="brandLogo" class="text-2xl font-bold text-amber-400 cursor-pointer select-none">
                    🪙 CoinFlip Casino
                </div>
                <span id="onlineStatus" class="text-xs bg-green-500 text-white px-2 py-1 rounded-full">LIVE</span>
            </div>
            <div id="userInfo" class="hidden items-center space-x-4">
                <span id="usernameDisplay" class="font-semibold text-amber-300"></span>
                <span id="balanceDisplay" class="bg-slate-800 px-4 py-2 rounded-lg font-bold text-lg">
                    ₹0.00
                </span>
                <button onclick="showDepositModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition">
                    💰 Deposit
                </button>
                <button onclick="showWithdrawalModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                    💳 Withdraw
                </button>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Game Area -->
            <div class="lg:col-span-2">
                <!-- Timer -->
                <div class="bg-slate-800/80 rounded-xl p-4 mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm text-slate-400">Next round in:</span>
                        <span id="timerDisplay" class="text-2xl font-bold text-amber-400">30</span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-2">
                        <div id="timerBar" class="timer-bar bg-amber-500 h-2 rounded-full" style="width: 100%"></div>
                    </div>
                </div>

                <!-- Coin Display -->
                <div class="bg-slate-800/80 rounded-xl p-8 mb-6">
                    <div class="coin-scene">
                        <div class="coin" id="coin">
                            <div class="coin-edge"></div>
                            <div class="coin-face coin-heads">H</div>
                            <div class="coin-face coin-tails">T</div>
                        </div>
                    </div>
                    <div id="resultDisplay" class="text-center mt-6 text-3xl font-bold hidden"></div>
                </div>

                <!-- Betting Controls -->
                <div class="bg-slate-800/80 rounded-xl p-6">
                    <h3 class="text-xl font-bold mb-4 text-amber-400">Place Your Bet</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <button onclick="placeBet('HEADS')" id="headsBetBtn" class="btn-primary text-lg py-4">
                            HEADS (H)
                        </button>
                        <button onclick="placeBet('TAILS')" id="tailsBetBtn" class="btn-primary text-lg py-4">
                            TAILS (T)
                        </button>
                    </div>
                    <div class="flex gap-4 mb-4">
                        <input type="number" id="betAmount" class="input-field flex-1" placeholder="Bet amount" min="10" value="100">
                        <button onclick="placeBet()" class="btn-secondary">Bet Now</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="quickBet(50)" class="btn-secondary text-sm flex-1">₹50</button>
                        <button onclick="quickBet(100)" class="btn-secondary text-sm flex-1">₹100</button>
                        <button onclick="quickBet(500)" class="btn-secondary text-sm flex-1">₹500</button>
                        <button onclick="quickBet(1000)" class="btn-secondary text-sm flex-1">₹1000</button>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="space-y-6">
                <!-- Current Round Info -->
                <div class="bg-slate-800/80 rounded-xl p-6">
                    <h3 class="text-lg font-bold mb-4 text-amber-400">Current Round</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between">
                            <span>HEADS Total:</span>
                            <span id="headsTotal" class="font-bold text-green-400">₹0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>TAILS Total:</span>
                            <span id="tailsTotal" class="font-bold text-blue-400">₹0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Total Bets:</span>
                            <span id="totalBets" class="font-bold">₹0</span>
                        </div>
                    </div>
                </div>

                <!-- Recent Results -->
                <div class="bg-slate-800/80 rounded-xl p-6">
                    <h3 class="text-lg font-bold mb-4 text-amber-400">Recent Results</h3>
                    <div id="recentResults" class="flex flex-wrap gap-2">
                        <!-- Results will be displayed here -->
                    </div>
                </div>

                <!-- Live Users -->
                <div class="bg-slate-800/80 rounded-xl p-6">
                    <h3 class="text-lg font-bold mb-4 text-amber-400">Online Players</h3>
                    <div id="onlineUsers" class="space-y-2">
                        <!-- Online users will be displayed here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="bg-slate-800 rounded-xl p-8 max-w-md w-full slide-in">
            <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">Welcome to CoinFlip</h2>
            <div class="space-y-4">
                <input type="text" id="authUsername" class="input-field" placeholder="Username">
                <input type="password" id="authPassword" class="input-field" placeholder="Password">
                <div class="flex gap-4">
                    <button onclick="login()" class="btn-primary flex-1">Login</button>
                    <button onclick="signup()" class="btn-secondary flex-1">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="depositModal" class="modal">
        <div class="bg-slate-800 rounded-xl p-8 max-w-md w-full slide-in">
            <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">Deposit Funds</h2>
            <div class="space-y-4">
                <div class="text-center mb-4">
                    <p class="text-sm text-slate-400 mb-2">Scan QR Code to Pay</p>
                    <img id="qrCode" src="" alt="QR Code" class="mx-auto w-48 h-48 bg-white p-2 rounded-lg">
                    <p class="mt-2 text-sm text-amber-300" id="upiDisplay"></p>
                </div>
                <div class="space-y-3">
                    <input type="number" id="depositAmount" class="input-field" placeholder="Amount" min="10">
                    <input type="text" id="txnId" class="input-field" placeholder="Transaction ID">
                    <button onclick="submitDeposit()" class="btn-primary w-full">Submit Deposit</button>
                </div>
                <button onclick="closeModal('depositModal')" class="text-slate-400 hover:text-white">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Withdrawal Modal -->
    <div id="withdrawalModal" class="modal">
        <div class="bg-slate-800 rounded-xl p-8 max-w-md w-full slide-in">
            <h2 class="text-2xl font-bold mb-6 text-center
