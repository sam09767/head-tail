<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Silver 3D Coin Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="glass-panel">
        <div class="user-info">
            <span class="balance-badge">Balance: ₹<span id="userBalance">1000</span></span>
        </div>
        <div class="header-buttons">
            <button class="action-btn" onclick="openModal('depositModal')">Deposit History</button>
            <button class="action-btn" onclick="openModal('withdrawModal')">Withdraw History</button>
        </div>
    </header>

    <!-- 3D Coin Arena -->
    <div class="coin-arena">
        <div class="coin-bounce" id="coinBounce">
            <div class="coin-container" id="coin">
                <div class="coin-face heads">HEADS</div>
                <div class="coin-face tails">TAILS</div>
            </div>
        </div>
        <div class="coin-shadow" id="coinShadow"></div>
    </div>

    <!-- Last 10 Results History -->
    <div class="history-container glass-panel">
        <div class="history-title">LAST 10 RESULTS</div>
        <div id="historyList" class="history-list">
            <span class="history-empty">No history yet</span>
        </div>
    </div>

    <!-- Betting Controls -->
    <div class="betting-section glass-panel">
        <div class="chips-container">
            <button class="chip-btn" onclick="selectChip(10)">₹10</button>
            <button class="chip-btn" onclick="selectChip(50)">₹50</button>
            <button class="chip-btn" onclick="selectChip(100)">₹100</button>
            <button class="chip-btn" onclick="selectChip(500)">₹500</button>
        </div>
        
        <div class="selected-amount">Selected Bet: ₹<span id="currentBet">10</span></div>

        <div class="action-buttons">
            <button class="btn-heads-bet" onclick="placeBet('HEADS')">BET ON HEADS</button>
            <button class="btn-tails-bet" onclick="placeBet('TAILS')">BET ON TAILS</button>
        </div>
    </div>

    <!-- Deposit History Modal -->
    <div id="depositModal" class="modal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>Deposit History</h2>
                <button class="close-btn" onclick="closeModal('depositModal')">&times;</button>
            </div>
            <table class="history-table">
                <thead>
                    <tr><th>Date</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody id="depositTableBody">
                    <!-- Data JS se aayega -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Withdraw History Modal -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2>Withdrawal History</h2>
                <button class="close-btn" onclick="closeModal('withdrawModal')">&times;</button>
            </div>
            <table class="history-table">
                <thead>
                    <tr><th>Date</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody id="withdrawTableBody">
                    <!-- Data JS se aayega -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Socket.io aur custom JS -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
